<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYNATRA · Reconectando</title>
    <link rel="icon" type="image/png" href="/logoz.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #f5f0e8 0%, #e8f4f5 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #2d3436;
      }
      .card {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(80, 184, 196, 0.18);
        max-width: 480px;
        width: 100%;
        padding: 3rem 2rem;
        text-align: center;
      }
      .logo { width: 96px; height: auto; margin: 0 auto 1.5rem; display: block; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #fff4e5;
        color: #b7791f;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        margin-bottom: 1rem;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%; background: #f0a500;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: #6b7280; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.75rem; }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #50b8c4 0%, #2d7d8a 100%);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 0.85rem 2rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(80, 184, 196, 0.35); }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/logoz.png" alt="ZYNATRA" />
      <span class="badge"><span class="dot"></span> Reconectando</span>
      <h1>Estamos solucionando un problema</h1>
      <p>
        El servicio está tardando más de lo normal. Estamos trabajando para
        restaurarlo — en unos segundos debería volver a funcionar.
      </p>
      <button class="btn" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
