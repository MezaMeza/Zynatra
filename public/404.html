<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYNATRA · Página no encontrada</title>
    <link rel="icon" type="image/png" href="/logoz.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #f5f0e8 0%, #e8f4f5 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #2d3436;
      }
      .card {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(80, 184, 196, 0.18);
        max-width: 480px;
        width: 100%;
        padding: 3rem 2rem;
        text-align: center;
      }
      .logo { width: 96px; height: auto; margin: 0 auto 1.5rem; display: block; }
      .code {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #50b8c4 0%, #2d7d8a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 { font-size: 1.4rem; margin: 0.75rem 0 0.5rem; }
      p { color: #6b7280; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.75rem; }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #50b8c4 0%, #2d7d8a 100%);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 0.85rem 2rem;
        border-radius: 999px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(80, 184, 196, 0.35); }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/logoz.png" alt="ZYNATRA" />
      <div class="code">404</div>
      <h1>No encontramos esta página</h1>
      <p>
        El enlace puede haber cambiado o ya no existir.
        No te preocupes, tu información está segura.
      </p>
      <a class="btn" href="/">Volver al inicio</a>
    </main>
  </body>
</html>
