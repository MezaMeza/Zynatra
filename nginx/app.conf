# `app` container: serves the built SPA from /usr/share/nginx/html on :8080.
# Internal only (never published). Cache + compression live here because the
# files are local; the proxy does not recompress (avoids double-encoding).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never leak the nginx version.
    server_tokens off;

    # Precompressed assets produced by scripts/gzip-dist.mjs.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness endpoint for the Docker healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build artifacts are content-addressed → cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so new deploy hashes are picked
    # up immediately after a rollout.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Friendly, branded error pages — never expose stack traces or code.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location = /50x.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths return index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
