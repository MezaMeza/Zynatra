# `proxy` edge container (nginx-unprivileged). Mounted at
# /etc/nginx/conf.d/default.conf, so this file runs inside the image's `http`
# context (the stock nginx.conf is left intact for its unprivileged temp paths).
#
# Public port 80 (host) -> container 8080. Plain HTTP only: no TLS, no HSTS.
# Adds security headers, basic rate limiting and reverse-proxies to `app`.

# Hide the nginx version in responses and error pages.
server_tokens off;

# Compose service name resolves on the shared bridge network.
upstream zynatra_app {
    server app:8080;
    keepalive 16;
}

# Abuse protection: 10 req/s per client IP with a burst of 20.
limit_req_zone $binary_remote_addr zone=zynatra_rl:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    # Security headers. HSTS is intentionally omitted because the site is
    # served over plain HTTP.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=zynatra_rl burst=20 nodelay;

        proxy_pass http://zynatra_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NOTE: no error_page interception here. The `app` container already
        # serves index.html for unknown client-side routes via try_files, and
        # real 404s (e.g. a missing /assets/* file) MUST stay 404 — intercepting
        # them would mask broken assets with a 200 index.html.
    }
}
